<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面宠物</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #pet-container {
            position: fixed;
            cursor: move;
            user-select: none;
            z-index: 9999;
        }

        #pet-container.dragging {
            cursor: grabbing;
        }

        #pet-image {
            display: block;
            width: 150px;
            height: auto;
            pointer-events: none;
        }

        #speech-bubble {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 10px 15px;
            margin-bottom: 10px;
            min-width: 120px;
            max-width: 200px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        #speech-bubble.show {
            opacity: 1;
        }

        #speech-bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 10px solid transparent;
            border-top-color: #333;
        }

        #speech-bubble::before {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 8px solid transparent;
            border-top-color: white;
            z-index: 1;
            margin-top: -2px;
        }

        #speech-text {
            font-size: 14px;
            color: #333;
            text-align: center;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div id="pet-container">
        <div id="speech-bubble">
            <div id="speech-text"></div>
        </div>
        <img id="pet-image" src="default.png" alt="Pet">
    </div>

    <script>
        // 配置
        const CONFIG = {
            frameRate: 150, // 动画帧率（毫秒）
            walkSpeed: 2, // 走路速度
            idleTimeMin: 3000, // 最小待机时间
            idleTimeMax: 8000, // 最大待机时间
            speechDuration: 3000, // 对话持续时间
        };

        // 动作帧数据
        const ANIMATIONS = {
            default: ['default.png'],
            catch: ['catch1.png', 'catch-left.png', 'catch-right.png'],
            cry: ['cry-1.png', 'cry-2.png', 'cry-3.png', 'cry-4.png'],
            sleep: ['sleep1.png', 'sleep2.png', 'sleep3.png', 'sleep4.png', 'sleep5.png', 'sleep6.png'],
            walk: ['walk1.png', 'walk2.png', 'walk3.png', 'walk4.png'],
            walkRight: ['walk-right1.png', 'walk-right2.png', 'walk-right3.png', 'walk-right4.png']
        };

        // 对话内容池
        const SPEECHES = [
            "濡堝鏃╀笂濂�",
            "浣犳槸鎴戝濡�",
            "m҈̧̳͍̆̌̒͂̄͝ͅǒ̶̢̤̮̽̈̄͝m̷̧̩͙͖͔͗͊̏̓͡ î̷̗̩̲͔̤̇̑̕͜ l̴̨̮̮̔̐̕o҉̢̘̰̜͕̏͛̒͞v҉̛̘̬̅͒͊͢e҉̡͙̟͔̙̮҇̀́̎͑ y̶̖̫͕̌̋͢͝o҉̢̩̘̇͆͋́̚͞u҉̤̩҇͛̑͑̇̀͜"
        ];

        class DesktopPet {
            constructor() {
                this.container = document.getElementById('pet-container');
                this.image = document.getElementById('pet-image');
                this.bubble = document.getElementById('speech-bubble');
                this.speechText = document.getElementById('speech-text');

                this.currentAnimation = 'default';
                this.currentFrame = 0;
                this.animationTimer = null;
                this.behaviorTimer = null;
                this.animationTimeout = null; // 用于存储 setTimeout
                this.isDragging = false;
                this.isWalking = false;
                this.walkDirection = 1; // 1: right, -1: left
                this.walkTargetX = 0;

                // 初始位置
                this.x = window.innerWidth / 2 - 75;
                this.y = window.innerHeight - 200;

                this.init();
            }

            init() {
                this.updatePosition();
                this.setupDragAndDrop();
                this.setupClick();
                this.startAnimation();
                this.startBehavior();
            }

            setupDragAndDrop() {
                let startX, startY, initialX, initialY;

                this.container.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    this.isDragging = true;
                    this.stopBehavior();
                    this.playAnimation('catch');

                    startX = e.clientX;
                    startY = e.clientY;
                    initialX = this.x;
                    initialY = this.y;

                    this.container.classList.add('dragging');
                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!this.isDragging) return;

                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;

                    this.x = initialX + dx;
                    this.y = initialY + dy;

                    this.updatePosition();
                });

                document.addEventListener('mouseup', () => {
                    if (!this.isDragging) return;
                    this.isDragging = false;
                    this.container.classList.remove('dragging');
                    this.playAnimation('default');
                    this.startBehavior();
                });
            }

            setupClick() {
                this.container.addEventListener('click', (e) => {
                    if (!this.isDragging) {
                        // 如果正在睡觉或哭泣，点击唤醒
                        if (this.currentAnimation === 'sleep' || this.currentAnimation === 'cry') {
                            // 清除所有动画定时器
                            if (this.animationTimer) {
                                clearInterval(this.animationTimer);
                                this.animationTimer = null;
                            }
                            if (this.animationTimeout) {
                                clearTimeout(this.animationTimeout);
                                this.animationTimeout = null;
                            }
                            this.playAnimation('default');
                            this.startBehavior();
                        } else {
                            this.cry();
                        }
                    }
                });

                this.container.addEventListener('dblclick', () => {
                    this.speak();
                });
            }

            updatePosition() {
                // 边界检测
                const maxX = window.innerWidth - 150;
                const maxY = window.innerHeight - 150;

                this.x = Math.max(0, Math.min(this.x, maxX));
                this.y = Math.max(0, Math.min(this.y, maxY));

                this.container.style.left = this.x + 'px';
                this.container.style.top = this.y + 'px';
            }

            playAnimation(animationName, loop = true, onComplete = null, freezeLastFrame = false) {
                if (!ANIMATIONS[animationName]) return;

                this.currentAnimation = animationName;
                this.currentFrame = 0;

                if (this.animationTimer) {
                    clearInterval(this.animationTimer);
                }

                const frames = ANIMATIONS[animationName];

                this.animationTimer = setInterval(() => {
                    this.image.src = frames[this.currentFrame];
                    this.currentFrame++;

                    if (this.currentFrame >= frames.length) {
                        if (loop) {
                            this.currentFrame = 0;
                        } else {
                            clearInterval(this.animationTimer);
                            if (freezeLastFrame) {
                                // 保持在最后一帧
                                this.image.src = frames[frames.length - 1];
                            }
                            if (onComplete) onComplete();
                        }
                    }
                }, CONFIG.frameRate);
            }

            startAnimation() {
                this.playAnimation('default');
            }

            startBehavior() {
                if (this.behaviorTimer) {
                    clearTimeout(this.behaviorTimer);
                }

                const scheduleNext = () => {
                    const delay = Math.random() * (CONFIG.idleTimeMax - CONFIG.idleTimeMin) + CONFIG.idleTimeMin;
                    this.behaviorTimer = setTimeout(() => {
                        this.randomBehavior();
                        scheduleNext();
                    }, delay);
                };

                scheduleNext();
            }

            stopBehavior() {
                if (this.behaviorTimer) {
                    clearTimeout(this.behaviorTimer);
                }
                this.isWalking = false;
            }

            randomBehavior() {
                const behaviors = ['walk', 'walkUp', 'walkDown', 'walkLeft', 'walkRight', 'sleep', 'cry'];
                const behavior = behaviors[Math.floor(Math.random() * behaviors.length)];

                if (behavior === 'walk') {
                    this.walk();
                } else if (behavior === 'walkUp') {
                    this.walkVertical(-1);
                } else if (behavior === 'walkDown') {
                    this.walkVertical(1);
                } else if (behavior === 'walkLeft') {
                    this.walkHorizontal(-1);
                } else if (behavior === 'walkRight') {
                    this.walkHorizontal(1);
                } else if (behavior === 'sleep') {
                    this.sleep();
                } else if (behavior === 'cry') {
                    this.cry();
                }
            }

            walk() {
                this.walkTargetX = Math.random() * (window.innerWidth - 150);
                this.walkDirection = this.walkTargetX > this.x ? 1 : -1;
                this.isWalking = true;

                // 根据方向选择动画
                const walkAnim = this.walkDirection > 0 ? 'walkRight' : 'walk';
                this.playAnimation(walkAnim);

                const walkInterval = setInterval(() => {
                    if (!this.isWalking) {
                        clearInterval(walkInterval);
                        this.playAnimation('default');
                        return;
                    }

                    const distance = Math.abs(this.walkTargetX - this.x);

                    if (distance < CONFIG.walkSpeed) {
                        this.x = this.walkTargetX;
                        this.isWalking = false;
                        clearInterval(walkInterval);
                        this.playAnimation('default');
                    } else {
                        this.x += CONFIG.walkSpeed * this.walkDirection;
                    }

                    this.updatePosition();
                }, 30);
            }

            walkHorizontal(direction) {
                // direction: 1 = right, -1 = left
                const distance = 100 + Math.random() * 200; // 随机距离
                this.walkTargetX = this.x + (distance * direction);
                this.walkDirection = direction;
                this.isWalking = true;

                const walkAnim = direction > 0 ? 'walkRight' : 'walk';
                this.playAnimation(walkAnim);

                const walkInterval = setInterval(() => {
                    if (!this.isWalking) {
                        clearInterval(walkInterval);
                        this.playAnimation('default');
                        return;
                    }

                    const distance = Math.abs(this.walkTargetX - this.x);

                    if (distance < CONFIG.walkSpeed) {
                        this.x = this.walkTargetX;
                        this.isWalking = false;
                        clearInterval(walkInterval);
                        this.playAnimation('default');
                    } else {
                        this.x += CONFIG.walkSpeed * direction;
                    }

                    this.updatePosition();
                }, 30);
            }

            walkVertical(direction) {
                // direction: 1 = down, -1 = up
                const distance = 100 + Math.random() * 200; // 随机距离
                const walkTargetY = this.y + (distance * direction);
                const walkAnim = direction > 0 ? 'walk' : 'walkRight'; // 上下用不同动画
                this.playAnimation(walkAnim);

                const walkInterval = setInterval(() => {
                    if (!this.isWalking) {
                        clearInterval(walkInterval);
                        this.playAnimation('default');
                        return;
                    }

                    const distance = Math.abs(walkTargetY - this.y);

                    if (distance < CONFIG.walkSpeed) {
                        this.y = walkTargetY;
                        this.isWalking = false;
                        clearInterval(walkInterval);
                        this.playAnimation('default');
                    } else {
                        this.y += CONFIG.walkSpeed * direction;
                    }

                    this.updatePosition();
                }, 30);

                this.isWalking = true;
            }

            sleep() {
                this.stopBehavior();

                // sleep动画：前3帧各1秒，后3帧各0.67秒，总共5秒
                const sleepFrames = ANIMATIONS.sleep;
                this.currentAnimation = 'sleep';
                this.currentFrame = 0;

                if (this.animationTimer) {
                    clearInterval(this.animationTimer);
                }
                if (this.animationTimeout) {
                    clearTimeout(this.animationTimeout);
                }

                let frameIndex = 0;
                const playNextFrame = () => {
                    this.image.src = sleepFrames[frameIndex];
                    frameIndex++;

                    if (frameIndex < sleepFrames.length) {
                        // 前3帧1000ms，后3帧667ms，总共约5秒
                        const delay = frameIndex <= 3 ? 1000 : 667;
                        this.animationTimeout = setTimeout(playNextFrame, delay);
                    } else {
                        // 完成一次完整动画后，循环播放 sleep4-6
                        this.loopSleepEnd();
                    }
                };

                playNextFrame();
            }

            loopSleepEnd() {
                // 循环播放 sleep4, sleep5, sleep6
                const endFrames = ['sleep4.png', 'sleep5.png', 'sleep6.png'];
                let endFrameIndex = 0;

                this.animationTimer = setInterval(() => {
                    this.image.src = endFrames[endFrameIndex];
                    endFrameIndex = (endFrameIndex + 1) % endFrames.length;
                }, 500); // 每0.5秒切换一帧
            }

            cry() {
                this.stopBehavior();

                // cry动画：4帧，总共5秒 = 每帧1.25秒
                const cryFrames = ANIMATIONS.cry;
                this.currentAnimation = 'cry';
                this.currentFrame = 0;

                if (this.animationTimer) {
                    clearInterval(this.animationTimer);
                }
                if (this.animationTimeout) {
                    clearTimeout(this.animationTimeout);
                }

                let frameIndex = 0;
                const playNextFrame = () => {
                    this.image.src = cryFrames[frameIndex];
                    frameIndex++;

                    if (frameIndex < cryFrames.length) {
                        this.animationTimeout = setTimeout(playNextFrame, 1250); // 1.25秒每帧
                    } else {
                        // 完成一次完整动画后，循环播放 cry-3, cry-4
                        this.loopCryEnd();
                    }
                };

                playNextFrame();
            }

            loopCryEnd() {
                // 循环播放 cry-3, cry-4
                const endFrames = ['cry-3.png', 'cry-4.png'];
                let endFrameIndex = 0;

                this.animationTimer = setInterval(() => {
                    this.image.src = endFrames[endFrameIndex];
                    endFrameIndex = (endFrameIndex + 1) % endFrames.length;
                }, 600); // 每0.6秒切换一帧
            }

            speak(text = null) {
                if (!text) {
                    text = SPEECHES[Math.floor(Math.random() * SPEECHES.length)];
                }

                this.speechText.textContent = text;
                this.bubble.classList.add('show');

                setTimeout(() => {
                    this.bubble.classList.remove('show');
                }, CONFIG.speechDuration);
            }
        }

        // 初始化桌宠
        window.addEventListener('DOMContentLoaded', () => {
            const pet = new DesktopPet();

            // 每隔一段时间随机说话
            setInterval(() => {
                if (Math.random() < 0.3) {
                    pet.speak();
                }
            }, 20000);
        });
    </script>
</body>
</html>
